<!-- @dsCard group="Colors" viewport="700x100" name="Neutral Scale" subtitle="Full --neutral-* ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); }
  .row { display: flex; height: 60px; }
  .swatch { flex: 1; display: flex; align-items: flex-end; padding: 4px 6px; }
  .label { font-size: 9px; font-weight: 700; letter-spacing: 0.03em; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch" style="background:#0d0d0d;"><span class="label" style="color:#fff;">950</span></div>
  <div class="swatch" style="background:#1a1a1a;"><span class="label" style="color:#fff;">900</span></div>
  <div class="swatch" style="background:#2e2e2e;"><span class="label" style="color:#fff;">800</span></div>
  <div class="swatch" style="background:#454545;"><span class="label" style="color:#fff;">700</span></div>
  <div class="swatch" style="background:#5e5e5e;"><span class="label" style="color:#fff;">600</span></div>
  <div class="swatch" style="background:#787878;"><span class="label" style="color:#fff;">500</span></div>
  <div class="swatch" style="background:#969696;"><span class="label" style="color:#fff;">400</span></div>
  <div class="swatch" style="background:#b5b5b5;"><span class="label" style="color:#1a1a1a;">300</span></div>
  <div class="swatch" style="background:#d4d4d4;"><span class="label" style="color:#1a1a1a;">200</span></div>
  <div class="swatch" style="background:#ebebeb;"><span class="label" style="color:#1a1a1a;">100</span></div>
  <div class="swatch" style="background:#f7f7f7; border: 1px solid #ebebeb;"><span class="label" style="color:#1a1a1a;">50</span></div>
</div>
</body>
</html>
