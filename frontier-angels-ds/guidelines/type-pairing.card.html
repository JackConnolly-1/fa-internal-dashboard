<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--navy-900); color: #fff; }
  .eyebrow { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-500); margin-bottom: 6px; }
  .headline { font-family: var(--font-display); font-size: 32px; font-weight: 800; line-height: 1.15; color: #fff; margin: 0 0 10px; }
  .body { font-family: var(--font-body); font-size: 15px; line-height: 1.6; color: rgba(255,255,255,0.72); margin: 0 0 14px; max-width: 520px; }
  .cta { font-family: var(--font-body); font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold-500); }
</style>
</head>
<body>
  <div class="eyebrow">Frontier Angels · Fund 5</div>
  <div class="headline">Invest in the Next Generation of Founders</div>
  <div class="body">We back early-stage companies solving hard problems at the frontier. Join a network of angels changing what's possible.</div>
  <div class="cta">Learn More →</div>
</body>
</html>
