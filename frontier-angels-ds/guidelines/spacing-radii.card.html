<!-- @dsCard group="Spacing" viewport="700x120" name="Corner Radii" subtitle="--radius-* tokens" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 20px; background: #fff; font-family: var(--font-body); }
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { width: 48px; height: 48px; background: var(--navy-900); }
  .val { font-size: 9px; font-family: var(--font-mono); color: var(--neutral-500); }
  .name { font-size: 9px; color: var(--neutral-400); }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="box" style="border-radius:0;"></div><span class="val">none</span><span class="name">0px</span></div>
  <div class="item"><div class="box" style="border-radius:2px;"></div><span class="val">xs</span><span class="name">2px</span></div>
  <div class="item"><div class="box" style="border-radius:4px;"></div><span class="val">sm</span><span class="name">4px · btn</span></div>
  <div class="item"><div class="box" style="border-radius:6px;"></div><span class="val">md</span><span class="name">6px</span></div>
  <div class="item"><div class="box" style="border-radius:10px;"></div><span class="val">lg</span><span class="name">10px · card</span></div>
  <div class="item"><div class="box" style="border-radius:16px;"></div><span class="val">xl</span><span class="name">16px</span></div>
  <div class="item"><div class="box" style="border-radius:24px;"></div><span class="val">2xl</span><span class="name">24px</span></div>
  <div class="item"><div class="box" style="border-radius:9999px;"></div><span class="val">full</span><span class="name">pill</span></div>
</div>
</body>
</html>
