<!-- @dsCard group="Colors" viewport="700x100" name="Gold Scale" subtitle="Full --gold-* ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); }
  .row { display: flex; height: 60px; }
  .swatch { flex: 1; display: flex; align-items: flex-end; padding: 4px 6px; }
  .label { font-size: 9px; font-weight: 700; letter-spacing: 0.03em; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch" style="background:#3d2609;"><span class="label" style="color:#fff;">950</span></div>
  <div class="swatch" style="background:#5c3a10;"><span class="label" style="color:#fff;">900</span></div>
  <div class="swatch" style="background:#7a4e18;"><span class="label" style="color:#fff;">800</span></div>
  <div class="swatch" style="background:#9a6425;"><span class="label" style="color:#fff;">700</span></div>
  <div class="swatch" style="background:#BB8956;"><span class="label" style="color:#fff;">600</span></div>
  <div class="swatch" style="background:#c99970;"><span class="label" style="color:#fff;">500</span></div>
  <div class="swatch" style="background:#d6ad8e;"><span class="label" style="color:#5c3a10;">400</span></div>
  <div class="swatch" style="background:#e3c4ae;"><span class="label" style="color:#5c3a10;">300</span></div>
  <div class="swatch" style="background:#efd9ca;"><span class="label" style="color:#5c3a10;">200</span></div>
  <div class="swatch" style="background:#f7ede3;"><span class="label" style="color:#5c3a10;">100</span></div>
  <div class="swatch" style="background:#fdf6f0; border: 1px solid #efd9ca;"><span class="label" style="color:#5c3a10;">50</span></div>
</div>
</body>
</html>
