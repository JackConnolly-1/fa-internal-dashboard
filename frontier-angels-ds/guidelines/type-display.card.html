<!-- @dsCard group="Type" viewport="700x220" name="Display Type" subtitle="Bitter slab serif — headlines & display" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 20px; background: #fff; font-family: var(--font-display); color: var(--navy-900); }
  .specimen { display: flex; flex-direction: column; gap: 4px; }
  .d2xl { font-size: 48px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; }
  .dxl  { font-size: 36px; font-weight: 700; line-height: 1.15; }
  .dlg  { font-size: 28px; font-weight: 700; line-height: 1.2; }
  .dmd  { font-size: 22px; font-weight: 700; line-height: 1.25; }
  .dsm  { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .meta { font-size: 9px; font-family: var(--font-mono); color: var(--neutral-400); margin-left: 8px; vertical-align: middle; font-weight: 400; }
</style>
</head>
<body>
<div class="specimen">
  <div class="d2xl">Frontier Angels<span class="meta">display-2xl · 48px · ExtraBold 800</span></div>
  <div class="dxl">Invest in the Frontier<span class="meta">display-xl · 36px · Bold 700</span></div>
  <div class="dlg">Early-Stage Ventures<span class="meta">display-lg · 28px · Bold 700</span></div>
  <div class="dmd">Portfolio Companies<span class="meta">display-md · 22px · Bold 700</span></div>
  <div class="dsm">Fund 5 — Open Now<span class="meta">display-sm · 18px · SemiBold 600</span></div>
</div>
</body>
</html>
