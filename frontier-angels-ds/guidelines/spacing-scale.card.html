<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing Scale" subtitle="4px grid — --space-* tokens" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 20px 12px; background: #fff; font-family: var(--font-body); }
  .row { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar { background: var(--navy-900); width: 28px; }
  .val { font-size: 9px; font-family: var(--font-mono); color: var(--neutral-500); }
  .px  { font-size: 9px; color: var(--neutral-400); }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="bar" style="height:4px;"></div><span class="val">space-1</span><span class="px">4px</span></div>
  <div class="item"><div class="bar" style="height:8px;"></div><span class="val">space-2</span><span class="px">8px</span></div>
  <div class="item"><div class="bar" style="height:12px;"></div><span class="val">space-3</span><span class="px">12px</span></div>
  <div class="item"><div class="bar" style="height:16px;"></div><span class="val">space-4</span><span class="px">16px</span></div>
  <div class="item"><div class="bar" style="height:20px;"></div><span class="val">space-5</span><span class="px">20px</span></div>
  <div class="item"><div class="bar" style="height:24px;"></div><span class="val">space-6</span><span class="px">24px</span></div>
  <div class="item"><div class="bar" style="height:32px;"></div><span class="val">space-8</span><span class="px">32px</span></div>
  <div class="item"><div class="bar" style="height:40px;"></div><span class="val">space-10</span><span class="px">40px</span></div>
  <div class="item"><div class="bar" style="height:48px;"></div><span class="val">space-12</span><span class="px">48px</span></div>
  <div class="item"><div class="bar" style="height:64px; background: var(--navy-300);"></div><span class="val">space-16</span><span class="px">64px</span></div>
  <div class="item"><div class="bar" style="height:80px; background: var(--navy-200);"></div><span class="val">space-20</span><span class="px">80px</span></div>
  <div class="item"><div class="bar" style="height:96px; background: var(--navy-100);"></div><span class="val">space-24</span><span class="px">96px</span></div>
</div>
</body>
</html>
