<!-- @dsCard group="Brand" viewport="700x160" name="Fund Logos" subtitle="FA Fund 4 & Fund 5 sub-brands" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--neutral-50); }
  .row { display: flex; gap: 0; height: 160px; }
  .cell { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; border-right: 1px solid var(--neutral-100); }
  img { max-height: 100px; object-fit: contain; }
  .label { font-size: 11px; font-weight: 600; color: var(--neutral-500); letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="row">
  <div class="cell"><img src="../assets/brand/fa-ff4.jpg" alt="Fund 4 Logo"><span class="label">FA Fund 4</span></div>
  <div class="cell"><img src="../assets/brand/ff5-logo.png" alt="Fund 5 Logo"><span class="label">FA Fund 5</span></div>
  <div class="cell" style="background: var(--navy-900);">
    <img src="../assets/logos/logo-full-color.png" alt="Frontier Angels" style="max-height:90px;">
    <span class="label" style="color:rgba(255,255,255,0.5);">Frontier Angels</span>
  </div>
</div>
</body>
</html>
