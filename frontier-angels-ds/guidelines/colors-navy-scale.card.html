<!-- @dsCard group="Colors" viewport="700x100" name="Navy Scale" subtitle="Full --navy-* ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); }
  .row { display: flex; height: 60px; }
  .swatch { flex: 1; display: flex; align-items: flex-end; padding: 4px 6px; }
  .label { font-size: 9px; font-weight: 700; letter-spacing: 0.03em; }
  .hex-row { display: flex; height: 28px; background: #fff; }
  .hex-cell { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 9px; font-family: var(--font-mono); color: var(--neutral-500); border-right: 1px solid var(--neutral-100); }
</style>
</head>
<body>
<div class="row">
  <div class="swatch" style="background:#060f1e;"><span class="label" style="color:#ffffff;">950</span></div>
  <div class="swatch" style="background:#0C2140;"><span class="label" style="color:#ffffff;">900</span></div>
  <div class="swatch" style="background:#112c55;"><span class="label" style="color:#ffffff;">800</span></div>
  <div class="swatch" style="background:#163769;"><span class="label" style="color:#ffffff;">700</span></div>
  <div class="swatch" style="background:#1d4a88;"><span class="label" style="color:#ffffff;">600</span></div>
  <div class="swatch" style="background:#255da5;"><span class="label" style="color:#ffffff;">500</span></div>
  <div class="swatch" style="background:#4f7fbf;"><span class="label" style="color:#ffffff;">400</span></div>
  <div class="swatch" style="background:#80a5d2;"><span class="label" style="color:#0C2140;">300</span></div>
  <div class="swatch" style="background:#b4cae6;"><span class="label" style="color:#0C2140;">200</span></div>
  <div class="swatch" style="background:#d9e6f3;"><span class="label" style="color:#0C2140;">100</span></div>
  <div class="swatch" style="background:#edf4fb; border: 1px solid #d9e6f3;"><span class="label" style="color:#0C2140;">50</span></div>
</div>
</body>
</html>
